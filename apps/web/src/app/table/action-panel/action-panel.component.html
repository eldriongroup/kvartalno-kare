<section class="action-panel" aria-labelledby="turn-notification">
  <strong id="turn-notification">{{ notification() }}</strong>
  <div class="actions">@for (action of actions(); track action.type) { <button type="button" [class.primary]="action.type === 'call' || action.type === 'check'" [class.raise]="action.type === 'raise'">{{ action.label }}</button> }</div>
</section>
